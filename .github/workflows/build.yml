name: Build Blåhaj

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*', '[0-9]+.[0-9]+*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & package mod
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build assemble

      - name: Prepare distribution jars
        id: jars
        run: |
          mkdir -p dist
          cp build/libs/blahaj-*.jar dist/
          rm -f dist/*-dirty*.jar

          RELEASE_JAR=$(ls dist/blahaj-*.jar | grep -v '\-dev\.jar' | grep -v '\-sources\.jar' | head -n 1)
          DEV_JAR=$(ls dist/blahaj-*-dev.jar | head -n 1)
          SOURCES_JAR=$(ls dist/blahaj-*-sources.jar | head -n 1)

          cp "$RELEASE_JAR" dist/blahaj.jar
          cp "$DEV_JAR" dist/blahaj-dev.jar
          cp "$SOURCES_JAR" dist/blahaj-sources.jar

          echo "Distribution files ready in dist/:"
          ls -lh dist/

      - name: Publish rolling latest release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.jar \
            --title "Latest build" \
            --prerelease \
            --notes "Automated build from commit ${GITHUB_SHA:0:7}. These are raw uncompressed JAR files."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes

      - name: Output job summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## 🦈 Blåhaj Build Output (Raw Unzipped JARs)

          The build produced the following uncompressed `.jar` files:

          | JAR File | Description | Direct Download |
          | :--- | :--- | :--- |
          | **`blahaj.jar`** | Standard mod jar for GTNH | [📥 Download `blahaj.jar`](https://github.com/${{ github.repository }}/releases/download/latest/blahaj.jar) |
          | **`blahaj-dev.jar`** | Deobfuscated mod jar for development | [📥 Download `blahaj-dev.jar`](https://github.com/${{ github.repository }}/releases/download/latest/blahaj-dev.jar) |
          | **`blahaj-sources.jar`** | Source code jar | [📥 Download `blahaj-sources.jar`](https://github.com/${{ github.repository }}/releases/download/latest/blahaj-sources.jar) |

          > **Note**: Click any link above to download the raw `.jar` file directly. It will not be zipped.
          EOF
